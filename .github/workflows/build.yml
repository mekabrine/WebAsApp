name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build archive (NO signing)
        run: |
          xcodebuild archive \
            -scheme WebAsApp \
            -configuration Release \
            -archivePath build/WebAsApp.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            VALIDATE_PRODUCT=NO

      - name: Manually create unsigned IPA
        run: |
          APP_PATH="build/WebAsApp.xcarchive/Products/Applications/WebAsApp.app"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -qry WebAsApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebAsApp-unsigned-ipa
          path: WebAsApp-unsigned.ipa
